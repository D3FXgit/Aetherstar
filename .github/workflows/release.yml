name: Release

# Pushing a version tag (e.g. v1.1.0) builds installers on all three platforms
# and attaches them to a DRAFT GitHub release. Review the draft, then publish
# it by hand. electron-builder itself never uploads anything (--publish never,
# and publish: null in electron-builder.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            dist: dist:win
          - name: macos
            os: macos-latest
            dist: dist:mac
          - name: linux
            os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm ci

      # The predist:* hook builds the native module and rebuilds better-sqlite3
      # for Electron (npm run build:native && npm run rebuild:electron) before
      # electron-builder packages the app.
      - name: Build installers
        shell: bash
        # Unset secrets arrive as empty strings, and electron-builder treats an
        # empty CSC_LINK as a path (the working directory) and fails with
        # "not a file". Drop empty signing variables so unsigned builds work.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npm run ${{ matrix.dist }} -- --publish never
        env:
          # Optional macOS signing and notarization. Leave these secrets unset
          # for an unsigned build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -l installers

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: AetherStar ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/*
