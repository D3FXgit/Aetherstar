[package]
name = "aetherstar-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
cpal = "0.18"
rtrb = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
